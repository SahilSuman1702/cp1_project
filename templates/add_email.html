{% extends "auth_base.html" %}
{% set step = 2 %}
{% block body %}
<div class="hero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
<h1 class="title">Verify your email</h1>
<p class="sub">Enter the email for <strong>{{ userid }}</strong>. We'll send a 6-digit code.</p>
<form action="/add-email" method="POST">
  <label for="email">Email address</label>
  <input id="email" type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" autocomplete="email" required autofocus>
  <button class="btn" type="submit">Send code</button>
</form>
<p class="note">Check your inbox and spam folder for the verification code.</p>
<p class="foot"><a href="/logout">Start over</a></p>
{% endblock %}
