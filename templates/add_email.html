<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DirectLine - Email</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>DirectLine</h1>

    <p>Enter the email for <strong>{{ userid }}</strong></p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/add-email" method="POST">

        <input
            type="email"
            name="email"
            placeholder="Email address"
            value="{{ email or '' }}"
            autocomplete="email"
            required
        >

        <p class="hint">We'll send a 6-digit code to verify it.</p>

        <button type="submit">

            Send Code

        </button>

    </form>

    <p class="hint"><a href="/logout">Start over</a></p>

</div>

</body>
</html>
