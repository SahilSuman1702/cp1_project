<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DirectLine</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>DirectLine</h1>

    <p>Enter your unique User ID</p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/login" method="POST">

        <input
            type="text"
            name="userid"
            placeholder="User ID"
            required
        >

        <div class="captcha">

            <div class="captcha-row">

                <img
                    id="captchaImg"
                    class="captcha-img"
                    src="/captcha.png"
                    alt="Captcha"
                >

                <button
                    type="button"
                    class="captcha-refresh"
                    onclick="refreshCaptcha()"
                    title="Get a new captcha"
                    aria-label="Get a new captcha"
                >
                    &#8635;
                </button>

            </div>

            <input
                type="text"
                name="captcha"
                placeholder="Enter the text from image"
                autocomplete="off"
                autocapitalize="off"
                spellcheck="false"
                maxlength="10"
                required
            >

        </div>

        <button type="submit">

            Continue

        </button>

    </form>

</div>

<script>

function refreshCaptcha(){

    document
    .getElementById("captchaImg")
    .src = "/captcha.png?t=" + Date.now();

    let box = document.querySelector("input[name=captcha]");
    box.value = "";
    box.focus();

}

// Back button / restored page: the old captcha is already used up, load a new one
window.addEventListener("pageshow", function(e){

    if(e.persisted){
        refreshCaptcha();
    }

});

</script>

</body>
</html>
