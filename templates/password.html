{% extends "auth_base.html" %}
{% set step = 2 %}
{% block body %}
<div class="hero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 018 0v3"/></svg></div>
<h1 class="title">Welcome back</h1>
<p class="sub">Enter the password for <strong>{{ userid }}</strong></p>
<form action="/enter-password" method="POST">
  <label for="password">Password</label>
  <input id="password" type="password" name="password" placeholder="Your password" autocomplete="current-password" required autofocus>
  <button class="btn" type="submit">Log in</button>
</form>
<p class="foot"><a href="/logout">Use a different user ID</a></p>
{% endblock %}
