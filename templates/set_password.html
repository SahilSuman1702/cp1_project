{% extends "auth_base.html" %}
{% set step = 2 %}
{% block body %}
<div class="hero"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></div>
<h1 class="title">Create your account</h1>
<p class="sub">Setting up <strong>{{ userid }}</strong>. We'll send a 6-digit code to your email.</p>
<form action="/set-password" method="POST">
  <label for="email">Email address</label>
  <input id="email" type="email" name="email" placeholder="you@example.com" value="{{ email or '' }}" autocomplete="email" required>
  <label for="password">Password</label>
  <input id="password" type="password" name="password" placeholder="At least 4 characters" autocomplete="new-password" required>
  <label for="confirm">Confirm password</label>
  <input id="confirm" type="password" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required>
  <p class="note">Use a real email address. Check your spam folder if the code doesn't arrive.</p>
  <button class="btn" type="submit">Create account and send code</button>
</form>
<p class="foot"><a href="/logout">Start over</a></p>
{% endblock %}
