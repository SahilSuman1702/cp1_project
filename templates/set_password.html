<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DirectLine - Set Password</title>

<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

<div class="login-box">

    <h1>DirectLine</h1>

    <p>Create a password for <strong>{{ userid }}</strong></p>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form action="/set-password" method="POST">

        <input
            type="password"
            name="password"
            placeholder="New Password"
            required
        >

        <input
            type="password"
            name="confirm"
            placeholder="Confirm Password"
            required
        >

        <button type="submit">

            Set Password &amp; Continue

        </button>

    </form>

</div>

</body>
</html>
